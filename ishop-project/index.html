<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iShop</title>


    <style>
        body {

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

        }


        .container {

            background-color: white;

            padding: 40px;

            text-align: center;

            border-radius: 10px;

            box-shadow: 0 0 10px gray;

        }


        h1 {

            margin-bottom: 10px;

        }


        p {

            margin-bottom: 30px;

        }


        a {

            display: block;

            text-decoration: none;

            background-color: #007bff;

            color: white;

            padding: 12px;

            margin: 15px 0;

            border-radius: 5px;

            width: 200px;

        }


        a:hover {

            background-color: #0056b3;

        }
    </style>

</head>


<body>


    <div class="container">


        <h1>
            Welcome to iShop
        </h1>


        <p>
            Please select an option
        </p>


        <a href="register.html">
            Register
        </a>


        <a href="login.html">
            Login
        </a>


    </div>

</html>
