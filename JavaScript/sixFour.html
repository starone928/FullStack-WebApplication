<!-- Example on conditional Operator === -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify user</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script>
        var users = [
            {UserName: 'john'},
            {UserName: 'john_nit'},
            {UserName: 'david'},
            {UserName: 'david11'} 
        ];
        function VerifyUser(){
            var username = document.getElementById("txtName").value;
            var nameMsg = document.getElementById("nameMsg");
            for (var user of users){                         //This checks each object one by one.
                if(user.UserName===username){                //Check whether the username stored in the array is exactly the same as the username typed by the user
                   nameMsg.innerHTML = "User name taken - try another";
                   nameMsg.className = "text-danger";
                   return;                                   //return; is used to stop the execution of a function immediately.
                }else{
                    nameMsg.innerHTML = "User Name Available";
                    nameMsg.className = "text-success";
                }
            }
        }
    </script>
</head>
<body>
    <h2>Register User</h2>
    <dl>
        <dt>User Name</dt>
        <dd><input type="text" onkeyup="VerifyUser()" id="txtName"></dd>
        <dd id="nameMsg"></dd>
    </dl>
</body>
</html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify user</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script>
        var users = [
            { UserName: 'john', Password: 'john@123' },
            { UserName: 'john_nit', Password: 'john11' },
            { UserName: 'david', Password: '12345' },
            { UserName: 'david11', Password: 'david@11' }
        ];
        function VerifyUser() {
            var username = document.getElementById("txtName").value;
            var password = document.getElementById("txtPwd").value;

            for (var user of users) {
                if (user.UserName === username && user.Password === password) {
                    document.write("<h2>Login Success</h2>");
                } else {

                }

</head>
