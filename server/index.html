<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consume API</title>

    <script src="../node_modules/jquery/dist/jquery.js"></script>

    <script>
        $(function () {

            $.ajax({
                method: 'GET',
                url: 'http://127.0.0.1:3030/products'
            })
                .then(function (data) {

                    $.each(data, function (key, value) {

                        $(`<li>${value.title}</li>`).appendTo("ul");

                    });

                });

        });
    </script>
</head>

<body>

    <h2>Products</h2>

    <ul></ul>

</body>

</html>
